  <style>

    .pulse-gold { animation: pulse-gold 2s infinite; }

    [data-theme="sepia"] .paper-texture {
      background-image: 
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");

      user-select: none;

    }

      transform: scale(0.94) translateY(1px);
      filter: brightness(0.85);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);

      'claude-sonnet-4-5-20250929': { provider: 'anthropic', name: 'Claude Sonnet 4.5', tier: 'balanced' },

      // OpenAI

    // ============================================
    // AGENT DEFINITIONS
    // ============================================
    const AGENTS = {
      architect: {
        id: 'architect',
        name: 'Architect',
        subtitle: 'Designer of Information Economy',
        color: 'gold',
        icon: '◈',
        description: 'Creates story bible, disclosure schedules, tension curves, and beat sheets.',
        contextAccess: ['story_bible', 'disclosures', 'tension_curve', 'chapters', 'beats'],
        systemPrompt: `You are the Architect, designer of the information economy for fiction.

Your role is to design and maintain:
- Story bible (objective reality—every fact that's "true")
- **Disclosure schedule** (YAML tracking when each major fact: hinted → suspected → confirmed)
- Tension curve (target intensity per chapter + WHAT'S WITHHELD per chapter)
- Character knowledge maps (per-character: knows / doesn't know / believes falsely)
- Chapter beat sheets (events + withheld info + target tension)

**CRITICAL: The disclosure schedule is your most important output.** Every secret, twist, or hidden motivation needs explicit chapter numbers for when it's hinted, when readers should suspect, and when it's confirmed.

Rules:
1. Story bible is FROZEN once approved—no retcons allowed
2. Every major fact needs a disclosure arc in YAML format:
   disclosure_schedule:
     fact_id:
       description: "what is objectively true"
       hinted_at: [chapter_numbers]
       suspected_by_reader: chapter_number
       confirmed: chapter_number
3. At least one major fact should be a TRUE SURPRISE (confirmed with no prior hints)
4. Tension curve must have valleys—constant high exhausts readers
5. Tension curve chapters must include "withheld" list alongside intensity number
6. Beat sheets specify what's WITHHELD, not just what happens
7. Character knowledge maps must be YAML structured:
   character_knowledge:
     character_name:
       knows: [list of facts]
       doesnt_know: [list of facts]
       believes_falsely: [list of false beliefs]

When given an outline or draft:
1. Extract ALL facts into story bible
2. Identify which facts are secrets/twists
3. Create disclosure_schedule YAML for each secret
4. Create character_knowledge YAML
5. Create tension_curve with withheld info per chapter

Output structured YAML for all information architecture documents.`
      },
      scribe: {
        id: 'scribe',
        name: 'Scribe',
        subtitle: 'Weaver of Prose',
        color: 'emerald',
        icon: '✦',
        description: 'Writes and revises prose based on beat sheets and feedback.',
        contextAccess: ['story_bible', 'disclosures', 'beats', 'feedback', 'chapters'],
        systemPrompt: `You are the Scribe, weaver of prose from structured beats.

You write prose from beats and revise based on feedback. You do not decide what happens or what's revealed—that's the Architect's job. You decide how it reads on the page.

Rules:
1. NEVER reveal anything marked WITHHELD in the beat sheet
2. NEVER have characters explain motivations unless beat specifies reveal
3. End scenes on questions, not answers (unless designated resolution beat)
4. Show, don't tell—especially emotions and realizations
5. When a character knows something the reader doesn't, write behavior AS IF they know it, but never state the knowledge
6. When revising: apply feedback in priority order, preserve marked spans verbatim
7. If feedback conflicts with a preserve span, keep the span—flag the conflict

Write with atmospheric prose, sharp dialogue, and controlled pacing.`
      },
      critic: {
        id: 'critic',
        name: 'Critic',
        subtitle: 'Reader\'s Advocate',
        color: 'rose',
        icon: '◇',
        description: 'Evaluates drafts through reader simulation, tension, and craft lenses.',
        contextAccess: ['chapters'],
        systemPrompt: `You are the Critic, modeling the reader's experience.

You evaluate drafts through three lenses:

1. READER SIMULATION (what does the reader experience?)
- What does the reader NOW believe to be true?
- What does the reader SUSPECT but not know?
- What questions is the reader actively holding?
- Where is dramatic irony active?
- Where was curiosity killed by over-explanation?

IMPORTANT: You have NO access to the story bible. You only know what the text has shown.

2. TENSION ASSESSMENT
- Does this chapter hit its target tension?
- Where are stakes deflated unnecessarily?
- Where does pacing go flat?
- Are there micro-tensions within quiet scenes?

3. CRAFT CRITIQUE
- Clichés and weak phrases
- Telling instead of showing
- Overwriting
- Also: note STRENGTHS (these become preserve candidates)

Output structured feedback as JSON with: reader_state, tension assessment, issues array, and preserve array.
Every criticism must include a specific instruction. Note strengths too.`
      },
      keeper: {
        id: 'keeper',
        name: 'Keeper',
        subtitle: 'Guardian of Secrets',
        color: 'violet',
        icon: '◆',
        description: 'Verifies information discipline and revision integrity.',
        contextAccess: ['story_bible', 'disclosures', 'chapters', 'feedback', 'beats'],
        systemPrompt: `You are the Keeper, guardian of what must stay hidden.

You guard constraints and verify nothing broke. You are the final gate.

You check two things:

1. INFORMATION DISCIPLINE
- Compare draft against disclosure schedule
- Flag any fact revealed before its scheduled chapter
- Flag "near misses" where careful readers might infer hidden facts

2. REVISION INTEGRITY
- Preserved spans appear VERBATIM in revision
- No new information leakage introduced during editing
- Constraints satisfied (word count, POV, banned phrases)
- No continuity errors (timeline, character locations, established facts)
- Tension score didn't regress from previous draft

Output verification as JSON with: passed (boolean), information_discipline findings, revision_integrity findings, and action (what to do next).

Rules:
1. You do NOT suggest fixes—only pass/fail with reasons
2. On failure, revision returns to Scribe with your flags
3. Be paranoid: when in doubt, flag it
4. "Near miss" = careful reader might infer; "Leakage" = fact is effectively confirmed
5. Nothing ships without your clearance`
      }
    };

    // ============================================

          return item ? JSON.parse(item) : null;
        } catch { return null; }

          return true;
        } catch { return false; }

      delete: (key) => {

          localStorage.removeItem(`syuzhet_${key}`);
          return true;
        } catch { return false; }
      }
    };

    // ============================================
    // THEME DEFINITIONS
    // ============================================
    const THEMES = {
      dark: {
        id: 'dark',
        name: 'Dark',
        icon: '🌙',
        description: 'Easy on the eyes for late-night writing'
      },
      light: {
        id: 'light', 
        name: 'Light',
        icon: '☀️',
        description: 'Clean and bright'
      },
      sepia: {
        id: 'sepia',
        name: 'Paper',
        icon: '📜',
        description: 'Warm, like writing on real paper'
      }
    };

    // Theme toggle component
    function ThemeToggle({ currentTheme, onThemeChange }) {
      return (
        <div className="flex items-center gap-1 p-1 rounded-lg" style={{ backgroundColor: 'var(--bg-tertiary)' }}>

    // ============================================
    // API CALL FUNCTIONS
    // ============================================
    async function callAnthropic(apiKey, model, systemPrompt, messages) {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          max_tokens: 64000,
          system: systemPrompt,
          messages: messages.map(m => ({ role: m.role, content: m.content }))
        })
      });
      
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `Anthropic API error: ${response.status}`);
      }
      
      const data = await response.json();
      return data.content[0].text;
    }

    async function callOpenAI(apiKey, model, systemPrompt, messages) {
      const apiMessages = [
        { role: 'system', content: systemPrompt },
        ...messages.map(m => ({ role: m.role, content: m.content }))
      ];
      
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model,
          messages: apiMessages
        })
      });
      
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `OpenAI API error: ${response.status}`);
      }
      
      const data = await response.json();
      return data.choices[0].message.content;
    }

    // ============================================
    // ARCHITECT VERIFICATION SYSTEM
    // ============================================
    
    // Check what YAML structures are present/missing in Architect output
    function verifyArchitectOutput(content) {
      const checks = {
        disclosure_schedule: {
          present: false,
          pattern: /disclosure_schedule:/i,
          description: 'Disclosure schedule tracking when facts are hinted → suspected → confirmed'
        },
        character_knowledge: {
          present: false,
          pattern: /character_knowledge:/i,
          description: 'Character knowledge maps (knows / doesnt_know / believes_falsely)'
        },
        tension_curve: {
          present: false,
          pattern: /tension_curve:|chapters:/i,
          description: 'Tension curve with intensity levels'
        },
        withheld_per_chapter: {
          present: false,
          pattern: /withheld:\s*\n\s*-/i,
          description: 'Withheld information lists per chapter'
        },
        hinted_suspected_confirmed: {
          present: false,
          pattern: /hinted_at:|suspected_by_reader:|confirmed:/i,
          description: 'Disclosure timing (hinted_at, suspected_by_reader, confirmed)'
        }
      };
      
      // Run checks
      for (const [key, check] of Object.entries(checks)) {
        check.present = check.pattern.test(content);
      }
      
      const missing = Object.entries(checks)
        .filter(([_, check]) => !check.present)
        .map(([key, check]) => ({ key, ...check }));
      
      const present = Object.entries(checks)
        .filter(([_, check]) => check.present)
        .map(([key, check]) => ({ key, ...check }));
      
      return { checks, missing, present, isComplete: missing.length === 0 };
    }
    
    // Generate follow-up prompt based on what's missing
    function generateCompletionPrompt(missing, originalContent) {
      if (missing.length === 0) return null;
      
      const missingList = missing.map(m => `- ${m.description}`).join('\n');
      
      return `Your previous output is missing some required YAML structures. Please add ONLY the missing sections below. Do not repeat content you already provided.

**Missing structures:**
${missingList}

**Required formats:**

${missing.some(m => m.key === 'disclosure_schedule' || m.key === 'hinted_suspected_confirmed') ? `
disclosure_schedule:
  secret_name:
    description: "What is objectively true"
    hinted_at: [chapter_numbers]
    suspected_by_reader: chapter_number
    confirmed: chapter_number
` : ''}
${missing.some(m => m.key === 'character_knowledge') ? `
character_knowledge:
  character_name:
    knows: [list of facts they know]
    doesnt_know: [list of facts hidden from them]
    believes_falsely: [list of false beliefs]
` : ''}
${missing.some(m => m.key === 'withheld_per_chapter') ? `
Each chapter in tension_curve needs:
  withheld:
    - "fact or information hidden from reader"
    - "another withheld element"
` : ''}

Please output ONLY the missing YAML sections now.`;
    }

    // ============================================

    // ============================================
    
    const GitHubAPI = {
      // Parse repo URL to get owner and repo name
      parseRepoUrl(url) {
        // Handle various formats: 
        // https://github.com/owner/repo
        // https://github.com/owner/repo.git
        // git@github.com:owner/repo.git
        // owner/repo
        const patterns = [
          /github\.com[/:]([\w-]+)\/([\w-]+?)(?:\.git)?$/,
          /^([\w-]+)\/([\w-]+)$/
        ];
        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match) return { owner: match[1], repo: match[2] };
        }
        return null;
      },
      
      // Fetch repository tree (file structure)
      async getRepoTree(token, owner, repo, branch = 'main') {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`,
          { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
        );
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || `GitHub API error: ${response.status}`);
        }
        const data = await response.json();
        return data.tree.filter(item => item.type === 'blob'); // Only files
      },
      
      // Fetch file content
      async getFileContent(token, owner, repo, path, branch = 'main') {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,
          { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
        );
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || `GitHub API error: ${response.status}`);
        }
        const data = await response.json();
        // Decode base64 content
        const content = atob(data.content.replace(/\n/g, ''));
        return { content, sha: data.sha };
      },
      
      // Check if branch exists
      async branchExists(token, owner, repo, branch) {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/branches/${branch}`,
          { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
        );
        return response.ok;
      },
      
      // Create branch from another branch
      async createBranch(token, owner, repo, newBranch, fromBranch = 'main') {
        // Get SHA of source branch
        const refResponse = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${fromBranch}`,
          { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
        );
        if (!refResponse.ok) throw new Error(`Could not find branch: ${fromBranch}`);
        const refData = await refResponse.json();
        
        // Create new branch
        const createResponse = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/refs`,
          {
            method: 'POST',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: `refs/heads/${newBranch}`, sha: refData.object.sha })
          }
        );
        if (!createResponse.ok) {
          const err = await createResponse.json().catch(() => ({}));
          throw new Error(err.message || 'Failed to create branch');
        }
        return true;
      },
      
      // Get current file SHA (needed for updates)
      async getFileSHA(token, owner, repo, path, branch) {
        try {
          const response = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,
            { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
          );
          if (response.ok) {
            const data = await response.json();
            return data.sha;
          }
        } catch (e) {}
        return null;
      },
      
      // Create or update file
      async createOrUpdateFile(token, owner, repo, path, content, message, branch, sha = null) {
        const body = {
          message,
          content: btoa(unescape(encodeURIComponent(content))), // Handle UTF-8
          branch
        };
        if (sha) body.sha = sha; // Required for updates
        
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
          {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }
        );
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || 'Failed to update file');
        }
        const data = await response.json();
        return data.content.sha;
      },
      
      // Check if file changed on remote (conflict detection)
      async checkForConflicts(token, owner, repo, path, localSHA, branch) {
        const remoteSHA = await this.getFileSHA(token, owner, repo, path, branch);
        if (!remoteSHA) return { conflict: false, isNew: true };
        if (remoteSHA !== localSHA) return { conflict: true, remoteSHA };
        return { conflict: false };
      }
    };

    // ============================================
    // GITHUB IMPORT MODAL
    // ============================================
    function GitHubImportModal({ config, chapters, onImport, onClose }) {
      const [step, setStep] = useState(config.repo ? 'files' : 'connect'); // connect, files, importing
      const [token, setToken] = useState(config.token || '');
      const [repoUrl, setRepoUrl] = useState(config.repo ? `${config.owner}/${config.repo}` : '');
      const [branch, setBranch] = useState(config.branch || 'main');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const [repoTree, setRepoTree] = useState([]);
      const [fileMapping, setFileMapping] = useState(config.fileMapping || {});
      const [importStatus, setImportStatus] = useState({});
      
      // Connect to repo
      const handleConnect = async () => {
        setError('');
        const parsed = GitHubAPI.parseRepoUrl(repoUrl);
        if (!parsed) {
          setError('Invalid repo URL. Use format: owner/repo or https://github.com/owner/repo');
          return;
        }
        
        setLoading(true);
        try {
          const tree = await GitHubAPI.getRepoTree(token, parsed.owner, parsed.repo, branch);
          // Filter to just text files we care about
          const textFiles = tree.filter(f => 
            /\.(md|txt|yaml|yml|json)$/i.test(f.path) && !f.path.startsWith('.')
          );
          setRepoTree(textFiles);
          setStep('files');
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };
      
      // Update file mapping
      const setMapping = (path, type, chapterNum = null) => {
        if (type === 'ignore') {
          const { [path]: removed, ...rest } = fileMapping;
          setFileMapping(rest);
        } else {
          setFileMapping(prev => ({
            ...prev,
            [path]: { type, ...(chapterNum !== null && { chapterNum }) }
          }));
        }
      };
      
      // Get next available chapter number
      const getNextChapterNum = () => {
        const used = new Set([
          ...Object.keys(chapters).map(n => parseInt(n)),
          ...Object.values(fileMapping).filter(m => m.type === 'chapter').map(m => m.chapterNum)
        ]);
        let n = 1;
        while (used.has(n)) n++;
        return n;
      };
      
      // Perform import
      const handleImport = async () => {
        const parsed = GitHubAPI.parseRepoUrl(repoUrl);
        if (!parsed) return;
        
        setStep('importing');
        setImportStatus({});
        
        const newChapters = {};
        const newRefs = {};
        const newSHAs = {};
        
        for (const [path, mapping] of Object.entries(fileMapping)) {
          try {
            setImportStatus(prev => ({ ...prev, [path]: 'loading' }));
            const { content, sha } = await GitHubAPI.getFileContent(token, parsed.owner, parsed.repo, path, branch);
            newSHAs[path] = sha;
            
            if (mapping.type === 'chapter') {
              newChapters[mapping.chapterNum] = {
                content,
                title: path.split('/').pop().replace(/\.[^.]+$/, ''),
                beats: '',
                feedback: ''
              };
            } else if (mapping.type === 'reference') {
              const id = path.replace(/[^a-zA-Z0-9]/g, '_');
              newRefs[id] = {
                label: path.split('/').pop().replace(/\.[^.]+$/, ''),
                content,
                path
              };
            }
            
            setImportStatus(prev => ({ ...prev, [path]: 'done' }));
          } catch (err) {
            setImportStatus(prev => ({ ...prev, [path]: 'error: ' + err.message }));
          }
        }
        
        // Create new config
        const newConfig = {
          token,
          owner: parsed.owner,
          repo: parsed.repo,
          branch,
          fileMapping,
          fileSHAs: newSHAs,
          lastSync: Date.now()
        };
        
        onImport(newConfig, newChapters, newRefs);
        
        // Wait a moment then close
        setTimeout(() => onClose(), 1500);
      };
      
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.8)' }}>
          <div className="w-full max-w-3xl max-h-[90vh] rounded-lg overflow-hidden flex flex-col" style={{ backgroundColor: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>
            {/* Header */}
            <div className="p-4 flex items-center justify-between" style={{ borderBottom: '1px solid var(--border-color)' }}>
              <h2 className="font-display text-2xl" style={{ color: 'var(--text-primary)' }}>
                📥 Import from GitHub
              </h2>
              <button onClick={onClose} className="text-2xl" style={{ color: 'var(--text-muted)' }}>×</button>
            </div>
            
            {/* Step indicator */}
            <div className="px-4 py-2 flex gap-4 text-xs" style={{ backgroundColor: 'var(--bg-secondary)' }}>
              <span style={{ color: step === 'connect' ? 'var(--accent-gold)' : 'var(--text-muted)' }}>1. Connect</span>
              <span>→</span>
              <span style={{ color: step === 'files' ? 'var(--accent-gold)' : 'var(--text-muted)' }}>2. Map Files</span>
              <span>→</span>
              <span style={{ color: step === 'importing' ? 'var(--accent-gold)' : 'var(--text-muted)' }}>3. Import</span>
            </div>
            
            {/* Content */}
            <div className="flex-1 overflow-y-auto p-6">
              {step === 'connect' && (
                <div className="space-y-4 max-w-md">
                  <div className="p-4 rounded-lg" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border-color)' }}>
                    <p className="text-sm mb-4" style={{ color: 'var(--text-primary)' }}>
                      <strong>How this works:</strong>
                    </p>
                    <ol className="text-sm space-y-2" style={{ color: 'var(--text-muted)' }}>
                      <li>1. Enter your GitHub token and repository</li>
                      <li>2. You'll manually assign each file to a chapter or reference</li>
                      <li>3. Chapters become editable; references are read-only</li>
                      <li>4. When you push, changes go to the <code className="px-1 rounded" style={{ backgroundColor: 'var(--bg-tertiary)' }}>syuzhet</code> branch</li>
                    </ol>
                  </div>
                  
                  <div>
                    <label className="block text-sm mb-2" style={{ color: 'var(--text-primary)' }}>GitHub Personal Access Token</label>
                    <input
                      type="password"
                      value={token}
                      onChange={(e) => setToken(e.target.value)}
                      placeholder="ghp_xxxxxxxxxxxx"
                      className="w-full rounded px-3 py-2 font-mono text-sm"
                      style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                    />
                    <p className="text-xs mt-1" style={{ color: 'var(--text-muted)' }}>
                      Needs <code>repo</code> scope. Create at GitHub → Settings → Developer settings → Personal access tokens
                    </p>
                  </div>
                  
                  <div>
                    <label className="block text-sm mb-2" style={{ color: 'var(--text-primary)' }}>Repository</label>
                    <input
                      type="text"
                      value={repoUrl}
                      onChange={(e) => setRepoUrl(e.target.value)}
                      placeholder="owner/repo or https://github.com/owner/repo"
                      className="w-full rounded px-3 py-2 font-mono text-sm"
                      style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm mb-2" style={{ color: 'var(--text-primary)' }}>Branch</label>
                    <input
                      type="text"
                      value={branch}
                      onChange={(e) => setBranch(e.target.value)}
                      placeholder="main"
                      className="w-full rounded px-3 py-2 font-mono text-sm"
                      style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                    />
                  </div>
                  
                  {error && (
                    <div className="p-3 rounded text-sm" style={{ backgroundColor: 'rgba(139, 41, 66, 0.2)', color: 'var(--accent-crimson)' }}>
                      {error}
                    </div>
                  )}
                  
                  <button
                    onClick={handleConnect}
                    disabled={!token || !repoUrl || loading}
                    className="w-full py-3 rounded font-body font-medium disabled:opacity-50"
                    style={{ backgroundColor: 'var(--accent-gold)', color: 'var(--bg-primary)' }}
                  >
                    {loading ? 'Connecting...' : 'Connect & Browse Files'}
                  </button>
                </div>
              )}
              
              {step === 'files' && (
                <div className="space-y-4">
                  <div className="p-3 rounded-lg text-sm" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border-color)' }}>
                    <strong>Assign each file</strong> to a Chapter (editable) or Reference (read-only). 
                    Unassigned files will be ignored.
                  </div>
                  
                  <div className="space-y-2">
                    {repoTree.map(file => {
                      const mapping = fileMapping[file.path];
                      return (
                        <div key={file.path} className="flex items-center gap-3 p-3 rounded-lg" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                          <div className="flex-1 min-w-0">
                            <div className="font-mono text-sm truncate" style={{ color: 'var(--text-primary)' }}>{file.path}</div>
                            <div className="text-xs" style={{ color: 'var(--text-muted)' }}>{(file.size / 1024).toFixed(1)} KB</div>
                          </div>
                          
                          <select
                            value={mapping?.type || 'ignore'}
                            onChange={(e) => {
                              const type = e.target.value;
                              if (type === 'chapter') {
                                setMapping(file.path, 'chapter', getNextChapterNum());
                              } else if (type === 'reference') {
                                setMapping(file.path, 'reference');
                              } else {
                                setMapping(file.path, 'ignore');
                              }
                            }}
                            className="rounded px-2 py-1 text-sm"
                            style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                          >
                            <option value="ignore">— Ignore —</option>
                            <option value="chapter">Chapter</option>
                            <option value="reference">Reference</option>
                          </select>
                          
                          {mapping?.type === 'chapter' && (
                            <input
                              type="number"
                              min="1"
                              value={mapping.chapterNum}
                              onChange={(e) => setMapping(file.path, 'chapter', parseInt(e.target.value) || 1)}
                              className="w-16 rounded px-2 py-1 text-sm text-center"
                              style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                            />
                          )}

                      );
                    })}
                  </div>
                  
                  <div className="flex gap-3 pt-4">
                    <button
                      onClick={() => setStep('connect')}

                    <button
                      onClick={handleImport}
                      disabled={Object.keys(fileMapping).length === 0}

                      style={{ backgroundColor: 'var(--accent-gold)', color: 'var(--bg-primary)' }}
                    >
                      Import {Object.keys(fileMapping).length} file{Object.keys(fileMapping).length !== 1 ? 's' : ''}

                  </div>
                </div>
              )}
              
              {step === 'importing' && (
                <div className="space-y-2">
                  <p className="text-sm mb-4" style={{ color: 'var(--text-muted)' }}>Importing files...</p>
                  {Object.entries(fileMapping).map(([path, mapping]) => (
                    <div key={path} className="flex items-center gap-3 p-2 rounded" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                      <span className="font-mono text-sm truncate flex-1" style={{ color: 'var(--text-primary)' }}>{path}</span>

                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );

    // ============================================
    // GITHUB PUSH MODAL
    // ============================================
    function GitHubPushModal({ config, chapters, onPush, onClose }) {
      const [step, setStep] = useState('check'); // check, confirm, pushing, done
      const [conflicts, setConflicts] = useState([]);
      const [changes, setChanges] = useState([]);
      const [pushStatus, setPushStatus] = useState({});
      const [error, setError] = useState('');
      const [commitMessage, setCommitMessage] = useState(`Update from Syuzhet - ${new Date().toLocaleDateString()}`);
      
      // Check for conflicts on mount
      useEffect(() => {
        checkChanges();
      }, []);
      
      const checkChanges = async () => {
        const foundChanges = [];
        const foundConflicts = [];
        
        // Check each mapped chapter
        for (const [path, mapping] of Object.entries(config.fileMapping)) {
          if (mapping.type === 'chapter' && chapters[mapping.chapterNum]) {
            const chapter = chapters[mapping.chapterNum];
            const localSHA = config.fileSHAs[path];
            
            try {
              const result = await GitHubAPI.checkForConflicts(
                config.token, config.owner, config.repo, path, localSHA, 'syuzhet'
              );
              
              if (result.isNew || !localSHA) {
                foundChanges.push({ path, chapter: mapping.chapterNum, status: 'new' });
              } else if (result.conflict) {
                foundConflicts.push({ path, chapter: mapping.chapterNum, remoteSHA: result.remoteSHA });
              } else {
                foundChanges.push({ path, chapter: mapping.chapterNum, status: 'modified' });
              }
            } catch (err) {
              // File might not exist on syuzhet branch yet
              foundChanges.push({ path, chapter: mapping.chapterNum, status: 'new' });
            }
          }
        }
        
        setChanges(foundChanges);
        setConflicts(foundConflicts);
        setStep('confirm');
      };
      
      const handlePush = async () => {
        setStep('pushing');
        setError('');
        
        try {
          // Ensure syuzhet branch exists
          const branchExists = await GitHubAPI.branchExists(config.token, config.owner, config.repo, 'syuzhet');
          if (!branchExists) {
            await GitHubAPI.createBranch(config.token, config.owner, config.repo, 'syuzhet', config.branch);
          }
          
          const newSHAs = { ...config.fileSHAs };
          
          // Push each changed file
          for (const change of changes) {
            const chapter = chapters[change.chapter];
            if (!chapter) continue;
            
            setPushStatus(prev => ({ ...prev, [change.path]: 'pushing' }));
            
            try {
              // Get current SHA on syuzhet branch (might be different from main)
              const currentSHA = await GitHubAPI.getFileSHA(config.token, config.owner, config.repo, change.path, 'syuzhet');
              
              const newSHA = await GitHubAPI.createOrUpdateFile(
                config.token, config.owner, config.repo,
                change.path, chapter.content,
                commitMessage,
                'syuzhet',
                currentSHA
              );
              
              newSHAs[change.path] = newSHA;
              setPushStatus(prev => ({ ...prev, [change.path]: 'done' }));
            } catch (err) {
              setPushStatus(prev => ({ ...prev, [change.path]: 'error' }));
              throw err;
            }
          }
          
          // Update config with new SHAs
          onPush({ ...config, fileSHAs: newSHAs, lastSync: Date.now() });
          setStep('done');
          
        } catch (err) {
          setError(err.message);
        }
      };
      
      const forceOverwrite = (path) => {
        // Move conflict to changes
        setConflicts(prev => prev.filter(c => c.path !== path));
        setChanges(prev => [...prev, { path, chapter: conflicts.find(c => c.path === path)?.chapter, status: 'overwrite' }]);
      };
      
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.8)' }}>
          <div className="w-full max-w-2xl max-h-[90vh] rounded-lg overflow-hidden flex flex-col" style={{ backgroundColor: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>
            {/* Header */}
            <div className="p-4 flex items-center justify-between" style={{ borderBottom: '1px solid var(--border-color)' }}>
              <h2 className="font-display text-2xl" style={{ color: 'var(--text-primary)' }}>
                📤 Push to GitHub
              </h2>
              <button onClick={onClose} className="text-2xl" style={{ color: 'var(--text-muted)' }}>×</button>
            </div>
            
            {/* Info banner */}
            <div className="px-4 py-2 text-xs" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--text-muted)' }}>
              All changes will be pushed to the <code className="px-1 rounded" style={{ backgroundColor: 'var(--bg-tertiary)' }}>syuzhet</code> branch. 
              Create a PR on GitHub to merge into <code className="px-1 rounded" style={{ backgroundColor: 'var(--bg-tertiary)' }}>{config.branch}</code>.
            </div>
            
            {/* Content */}
            <div className="flex-1 overflow-y-auto p-6">
              {step === 'check' && (
                <div className="text-center py-8">
                  <span className="animate-pulse text-4xl">⏳</span>
                  <p className="mt-4" style={{ color: 'var(--text-muted)' }}>Checking for changes...</p>
                </div>
              )}
              
              {step === 'confirm' && (
                <div className="space-y-4">
                  {/* Conflicts */}
                  {conflicts.length > 0 && (
                    <div className="p-4 rounded-lg" style={{ backgroundColor: 'rgba(234, 179, 8, 0.1)', border: '1px solid rgba(234, 179, 8, 0.3)' }}>
                      <h3 className="font-medium mb-2" style={{ color: '#eab308' }}>⚠️ Conflicts Detected</h3>
                      <p className="text-sm mb-3" style={{ color: 'var(--text-muted)' }}>
                        These files have changed on GitHub since you last imported. Pushing will overwrite the remote version.
                      </p>
                      {conflicts.map(c => (
                        <div key={c.path} className="flex items-center justify-between p-2 rounded mb-1" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                          <span className="font-mono text-sm" style={{ color: 'var(--text-primary)' }}>{c.path}</span>
                          <button
                            onClick={() => forceOverwrite(c.path)}
                            className="text-xs px-2 py-1 rounded"
                            style={{ backgroundColor: 'rgba(234, 179, 8, 0.2)', color: '#eab308' }}
                          >
                            Overwrite Anyway
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  
                  {/* Changes to push */}
                  {changes.length > 0 ? (
                    <div>
                      <h3 className="font-medium mb-2" style={{ color: 'var(--text-primary)' }}>Changes to Push</h3>
                      <div className="space-y-1">
                        {changes.map(c => (
                          <div key={c.path} className="flex items-center gap-3 p-2 rounded" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                            <span className="text-xs px-2 py-0.5 rounded" style={{
                              backgroundColor: c.status === 'new' ? 'rgba(16, 185, 129, 0.2)' : 
                                             c.status === 'overwrite' ? 'rgba(234, 179, 8, 0.2)' : 'rgba(99, 102, 241, 0.2)',
                              color: c.status === 'new' ? '#10b981' : 
                                    c.status === 'overwrite' ? '#eab308' : '#6366f1'
                            }}>
                              {c.status === 'new' ? 'NEW' : c.status === 'overwrite' ? 'OVERWRITE' : 'MOD'}
                            </span>
                            <span className="font-mono text-sm flex-1" style={{ color: 'var(--text-primary)' }}>{c.path}</span>
                            <span className="text-xs" style={{ color: 'var(--text-muted)' }}>Ch {c.chapter}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <p style={{ color: 'var(--text-muted)' }}>No mapped chapter files to push.</p>
                  )}
                  
                  {/* Commit message */}
                  <div>
                    <label className="block text-sm mb-2" style={{ color: 'var(--text-primary)' }}>Commit Message</label>
                    <input
                      type="text"
                      value={commitMessage}
                      onChange={(e) => setCommitMessage(e.target.value)}
                      className="w-full rounded px-3 py-2 text-sm"
                      style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                    />
                  </div>
                  
                  {error && (
                    <div className="p-3 rounded text-sm" style={{ backgroundColor: 'rgba(139, 41, 66, 0.2)', color: 'var(--accent-crimson)' }}>
                      {error}
                    </div>
                  )}
                  
                  <div className="flex gap-3 pt-4">
                    <button
                      onClick={onClose}
                      className="px-6 py-2 rounded font-body"
                      style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-muted)' }}
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handlePush}
                      disabled={changes.length === 0}
                      className="flex-1 py-2 rounded font-body font-medium disabled:opacity-50"
                      style={{ backgroundColor: 'var(--accent-gold)', color: 'var(--bg-primary)' }}
                    >
                      Push {changes.length} file{changes.length !== 1 ? 's' : ''} to syuzhet branch
                    </button>
                  </div>
                </div>
              )}
              
              {step === 'pushing' && (
                <div className="space-y-2">
                  <p className="text-sm mb-4" style={{ color: 'var(--text-muted)' }}>Pushing to syuzhet branch...</p>
                  {changes.map(c => (
                    <div key={c.path} className="flex items-center gap-3 p-2 rounded" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                      <span className="font-mono text-sm flex-1" style={{ color: 'var(--text-primary)' }}>{c.path}</span>
                      <span className="text-sm">
                        {pushStatus[c.path] === 'pushing' && '⏳'}
                        {pushStatus[c.path] === 'done' && '✅'}
                        {pushStatus[c.path] === 'error' && '❌'}
                      </span>
                    </div>
                  ))}
                  {error && (
                    <div className="p-3 rounded text-sm mt-4" style={{ backgroundColor: 'rgba(139, 41, 66, 0.2)', color: 'var(--accent-crimson)' }}>
                      {error}
                    </div>
                  )}
                </div>
              )}
              
              {step === 'done' && (
                <div className="text-center py-8">
                  <span className="text-6xl">✅</span>
                  <h3 className="font-display text-xl mt-4" style={{ color: 'var(--text-primary)' }}>Push Complete!</h3>
                  <p className="mt-2" style={{ color: 'var(--text-muted)' }}>
                    Changes are now on the <code className="px-1 rounded" style={{ backgroundColor: 'var(--bg-tertiary)' }}>syuzhet</code> branch.
                  </p>
                  <p className="text-sm mt-4" style={{ color: 'var(--text-muted)' }}>
                    <a 
                      href={`https://github.com/${config.owner}/${config.repo}/compare/${config.branch}...syuzhet`}
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{ color: 'var(--accent-gold)' }}
                    >
                      Open GitHub to create a Pull Request →
                    </a>
                  </p>
                  <button
                    onClick={onClose}
                    className="mt-6 px-6 py-2 rounded font-body"
                    style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-primary)' }}
                  >
                    Close
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function SettingsPanel({ apiKeys, onSaveKey, theme, onThemeChange, customPrompts, onSavePrompt, onResetPrompt, verifierModel, onVerifierModelChange }) {
      const [inputs, setInputs] = useState(apiKeys);
      const [saved, setSaved] = useState({});
      const [activeSection, setActiveSection] = useState('general'); // general, agents
      const [selectedAgent, setSelectedAgent] = useState('architect');
      const [promptDraft, setPromptDraft] = useState('');
      const [promptSaved, setPromptSaved] = useState(false);
      
      useEffect(() => {
        setInputs(apiKeys);
      }, [apiKeys]);
      
      // Load prompt when agent changes
      useEffect(() => {
        const currentPrompt = customPrompts[selectedAgent] || AGENTS[selectedAgent].systemPrompt;
        setPromptDraft(currentPrompt);
        setPromptSaved(false);
      }, [selectedAgent, customPrompts]);
      
      const handleSave = (provider) => {
        onSaveKey(provider, inputs[provider]);
        setSaved(prev => ({ ...prev, [provider]: true }));
        setTimeout(() => setSaved(prev => ({ ...prev, [provider]: false })), 2000);
      };
      
      const handleClear = (provider) => {
        onSaveKey(provider, '');
        setInputs(prev => ({ ...prev, [provider]: '' }));
      };
      
      const handleSavePrompt = () => {
        onSavePrompt(selectedAgent, promptDraft);
        setPromptSaved(true);
        setTimeout(() => setPromptSaved(false), 2000);
      };
      
      const handleResetPrompt = () => {
        if (confirm('Reset this agent\'s prompt to the default? Your customizations will be lost.')) {
          onResetPrompt(selectedAgent);
          setPromptDraft(AGENTS[selectedAgent].systemPrompt);
        }
      };
      
      const isPromptModified = customPrompts[selectedAgent] !== undefined;
      const hasUnsavedChanges = promptDraft !== (customPrompts[selectedAgent] || AGENTS[selectedAgent].systemPrompt);
      
      const providers = [
        { id: 'anthropic', name: 'Anthropic', color: '#c9a227', placeholder: 'sk-ant-...', description: 'Claude models (Opus, Sonnet, Haiku)' },

        { id: 'deepseek', name: 'DeepSeek', color: '#4f8cff', placeholder: 'sk-...', description: 'DeepSeek V3.2, Reasoner' },
        { id: 'moonshot', name: 'Kimi (Moonshot)', color: '#6366f1', placeholder: 'sk-...', description: 'Kimi K2 Turbo' },
      ];
      
      // Agent descriptions for the editor
      const agentDescriptions = {

        <div className="flex-1 flex flex-col overflow-hidden">

                              ✎

    // CHAT AREA COMPONENT

    function ChatArea({ chat, onSend, isLoading, agent, hasValidKey, verificationResult, onVerify, onComplete, verifierModel, apiKeys }) {
      const [input, setInput] = useState('');
      const messagesEndRef = useRef(null);
      
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chat.messages]);
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading || !hasValidKey) return;
        onSend(input);
        setInput('');
      };
      
      // Check if this is an Architect chat with assistant messages
      const isArchitect = chat.agentId === 'architect';
      const hasAssistantMessage = chat.messages.some(m => m.role === 'assistant' && !m.isError);
      
      // Check if verifier model has a valid key
      const verifierProvider = MODELS[verifierModel]?.provider;
      const hasVerifierKey = apiKeys[verifierProvider]?.length > 10;
      
      return (
        <div className="flex-1 flex flex-col overflow-hidden">
          {/* Messages */}
          <div className="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-6 paper-texture">
            {chat.messages.length === 0 && (
              <div className="text-center py-12">
                <p style={{ color: 'var(--text-muted)' }}>Start a conversation with the {agent.name}</p>
              </div>
            )}
            {chat.messages.map((msg, i) => (
              <div
                key={i}
                className={`animate-fadeIn ${msg.role === 'user' ? 'flex justify-end' : ''}`}
              >
                <div className={`max-w-3xl ${msg.role === 'user' ? 'text-right' : ''}`}>
                  {msg.role === 'assistant' && (
                    <div className="flex items-center gap-2 mb-2">
                      <span style={{
                        color: agent.color === 'gold' ? '#c9a227' :
                               agent.color === 'emerald' ? '#10b981' :
                               agent.color === 'rose' ? '#f43f5e' :
                               '#8b5cf6'
                      }}>{agent.icon}</span>
                      <span className="text-sm" style={{ color: 'var(--text-muted)' }}>{agent.name}</span>
                    </div>
                  )}
                  <div 
                    className="rounded-lg px-4 py-3 prose-editor"
                    style={
                      msg.role === 'user'
                        ? { backgroundColor: 'var(--chat-user-bg)', color: 'var(--text-primary)', display: 'inline-block' }
                        : msg.isError
                          ? { backgroundColor: 'rgba(139, 41, 66, 0.2)', color: 'var(--accent-crimson)', border: '1px solid rgba(139, 41, 66, 0.3)' }
                          : { backgroundColor: 'var(--chat-assistant-bg)', color: 'var(--text-primary)', border: '1px solid var(--chat-assistant-border)' }
                    }
                  >
                    <div className={`font-body text-sm whitespace-pre-wrap ${msg.role === 'assistant' ? 'font-mono text-xs' : ''}`}>
                      {msg.content}
                    </div>
                  </div>
                </div>
              </div>
            ))}
            {isLoading && (
              <div className="flex items-center gap-2">
                <span className="animate-pulse" style={{ color: 'var(--accent-gold)' }}>{agent.icon}</span>
                <span className="text-sm" style={{ color: 'var(--text-muted)' }}>Thinking...</span>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>
          
          {/* Architect Verification Panel */}
          {isArchitect && hasAssistantMessage && !isLoading && (
            <div className="px-6 py-3" style={{ backgroundColor: 'var(--bg-secondary)', borderTop: '1px solid var(--border-color)' }}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <button
                    onClick={onVerify}
                    className="text-xs font-body px-3 py-1.5 rounded transition-colors"
                    style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-primary)' }}
                  >
                    🔍 Verify Structure
                  </button>
                  
                  {verificationResult && (
                    <div className="flex items-center gap-2">
                      {verificationResult.isComplete ? (
                        <span className="text-xs px-2 py-1 rounded" style={{ backgroundColor: 'rgba(16, 185, 129, 0.2)', color: '#10b981' }}>
                          ✓ All structures present
                        </span>
                      ) : (
                        <>
                          <span className="text-xs px-2 py-1 rounded" style={{ backgroundColor: 'rgba(234, 179, 8, 0.2)', color: '#eab308' }}>
                            ⚠ Missing {verificationResult.missing.length} structure{verificationResult.missing.length > 1 ? 's' : ''}
                          </span>
                          <button
                            onClick={onComplete}
                            disabled={!hasVerifierKey}
                            className="text-xs font-body px-3 py-1.5 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            style={{ backgroundColor: 'var(--accent-gold)', color: 'var(--bg-primary)' }}
                            title={hasVerifierKey ? `Complete using ${MODELS[verifierModel]?.name}` : 'Set verifier model API key in Settings'}
                          >
                            Complete Missing →
                          </button>
                        </>
                      )}
                    </div>
                  )}
                </div>
                
                {/* Show current verifier model */}
                <div className="flex items-center gap-2 text-xs" style={{ color: 'var(--text-muted)' }}>
                  <span>Verifier:</span>
                  <span className="px-2 py-0.5 rounded" style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-primary)' }}>
                    {MODELS[verifierModel]?.name || verifierModel}
                  </span>
                  {!hasVerifierKey && (
                    <span style={{ color: 'var(--accent-crimson)' }}>(no key)</span>
                  )}
                </div>
              </div>
              
              {/* Missing structures detail */}
              {verificationResult && !verificationResult.isComplete && (
                <div className="mt-2 text-xs" style={{ color: 'var(--text-muted)' }}>
                  <span className="font-medium">Missing:</span>{' '}
                  {verificationResult.missing.map((m, i) => (
                    <span key={m.key}>
                      {m.key.replace(/_/g, ' ')}{i < verificationResult.missing.length - 1 ? ', ' : ''}
                    </span>
                  ))}
                </div>
              )}
            </div>
          )}
          
          {/* Input */}
          <form onSubmit={handleSubmit} className="p-6" style={{ borderTop: '1px solid var(--border-color)' }}>
            {!hasValidKey && (
              <p className="text-sm mb-3" style={{ color: 'var(--accent-crimson)' }}>⚠ Please add an API key for the selected model in Settings</p>
            )}
            <div className="flex gap-4">
              <textarea
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit(e);
                  }
                }}
                placeholder={hasValidKey ? `Message the ${agent.name}...` : 'Add API key in Settings first'}
                disabled={!hasValidKey}
                rows={3}
                className="flex-1 rounded-lg px-4 py-3 font-body text-sm focus:outline-none resize-none disabled:opacity-50 prose-editor"
                style={{ backgroundColor: 'var(--bg-input)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
              />
              <button
                type="submit"
                disabled={!input.trim() || isLoading || !hasValidKey}
                className="font-body font-medium px-6 rounded-lg transition-colors self-end disabled:opacity-50 disabled:cursor-not-allowed"
                style={{ backgroundColor: 'var(--accent-gold)', color: 'var(--bg-primary)' }}
              >
                Send
              </button>
            </div>
          </form>
        </div>
      );
    }

    function ChapterManager({ chapters, onSaveChapter, onDeleteChapter }) {
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [newChapterNum, setNewChapterNum] = useState('');
      const [editContent, setEditContent] = useState({ beats: '', draft: '', feedback: '' });
      const [activeTab, setActiveTab] = useState('beats');
      const [saveFlash, setSaveFlash] = useState(false);
      
      const chapterNums = Object.keys(chapters).sort((a, b) => parseInt(a) - parseInt(b));
      
      useEffect(() => {
        if (selectedChapter && chapters[selectedChapter]) {
          setEditContent({
            beats: chapters[selectedChapter].beats || '',
            draft: chapters[selectedChapter].draft || '',
            feedback: chapters[selectedChapter].feedback || ''
          });
        }
      }, [selectedChapter, chapters]);
      
      const createChapter = () => {
        const num = parseInt(newChapterNum);
        if (num > 0) {
          onSaveChapter(num, { beats: '', draft: '', feedback: '' });
          setSelectedChapter(num.toString());
          setNewChapterNum('');
        }
      };
      
      return (
        <div className="flex-1 flex">
          {/* Chapter list */}
          <div className="w-48 p-4" style={{ borderRight: '1px solid var(--border-color)' }}>
            <p className="text-xs uppercase tracking-wider mb-3" style={{ color: 'var(--text-muted)' }}>Chapters</p>
            <div className="space-y-1 mb-4">
              {chapterNums.map(num => (
                <button
                  key={num}
