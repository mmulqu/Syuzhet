# CHAPTER BEAT SHEET TEMPLATE
# Copy this template for each chapter and fill in all sections

chapter_number: XX
chapter_title: "Title Goes Here"

# =============================================================================
# TENSION & PACING TARGETS (from tension_curve.yaml)
# =============================================================================

target_tension: X/10  # Import from tension_curve.yaml
tension_type: "Type of tension (e.g., suspense, mystery, emotional)"
pacing: "Overall chapter pace (e.g., slow/methodical, building, explosive)"

# =============================================================================
# INFORMATION ARCHITECTURE
# What the reader should learn/suspect by end of this chapter
# =============================================================================

information_state:
  reader_learns:
    - "Concrete fact reader definitively learns this chapter"
    - "Evidence or testimony that's revealed"

  reader_suspects:
    - "What reader should begin to suspect (but not confirm)"
    - "Patterns reader should be noticing"

  withheld:
    - "Critical information that MUST NOT be revealed yet"
    - "Information from story_bible.yaml not scheduled for this chapter"

  dramatic_irony:
    active: yes/no
    description: "If yes, what does reader know that protagonist doesn't?"

# =============================================================================
# CHARACTER KNOWLEDGE CHANGES
# What do characters learn/realize in this chapter?
# =============================================================================

character_knowledge_changes:
  protagonist:
    learns: "New fact or evidence protagonist gains"
    believes: "What they conclude (may be wrong)"
    internal_conflict: "Any new doubts or struggles"

  antagonist:
    learns: "What antagonist discovers (e.g., investigation progress)"
    reaction: "How this affects their behavior"

  supporting_characters:
    - character: "Name"
      learns: "What they learn"
      impact: "How it affects them or plot"

# =============================================================================
# SCENE BEATS
# Break chapter into 3-5 beats (scenes or major moments)
# =============================================================================

beats:
  - beat_number: 1
    description: "One-sentence summary of what happens"

    plot_function: "What happens (action, dialogue, event)"

    information_function:
      reveals: "What this beat reveals to reader"
      withholds: "What this beat specifically does NOT reveal"
      hints_at: "Subtle breadcrumbs planted"

    character_function:
      protagonist_arc: "How protagonist changes/reacts"
      other_characters: "Relevant character moments"

    pacing: "Fast/medium/slow"
    word_count_target: XXX

    end_beat_on:
      type: "Question / Revelation / Decision / Cliffhanger"
      description: "Specific line or moment to end beat"

  - beat_number: 2
    description: "Second beat summary"
    # ... repeat structure

  # Continue for 3-5 beats total

# =============================================================================
# CHAPTER OPENING
# First line/paragraph should accomplish:
# =============================================================================

opening:
  hook: "What grabs reader attention immediately?"
  grounds_reader: "Where are we? Who's POV? When is this?"
  tone: "Emotional/atmospheric note to set"

  example_first_line: "Draft suggestion for opening"

# =============================================================================
# CHAPTER CLOSING
# Last paragraph should accomplish:
# =============================================================================

closing:
  type: "Question / Revelation / Decision / Cliffhanger"

  purpose: "Why this ending pulls reader to next chapter"

  emotional_note: "Feeling reader should be left with"

  example_last_line: "Draft suggestion for closing"

  loops_opened:
    - "New question raised by chapter ending"

  loops_closed:
    - "Any questions answered (if this is revelation chapter)"

# =============================================================================
# POV & NARRATIVE STYLE
# =============================================================================

pov:
  character: "Whose POV is this chapter?"
  distance: "Close third / Distant third / First person"
  access: "What can narrator reveal about this character's inner life?"

narrative_constraints:
  - "Specific things narrator CANNOT reveal due to POV limits"
  - "Information character knows but reader shouldn't learn yet"

# =============================================================================
# SCENE SETTINGS & ATMOSPHERE
# =============================================================================

primary_settings:
  - location: "Where does scene take place?"
    atmosphere: "Mood/feeling of this location"
    sensory_details: "Key smells, sounds, visuals to include"

# =============================================================================
# DIALOGUE NOTES
# =============================================================================

key_dialogues:
  - exchange_between: "Character A and Character B"
    purpose: "What this conversation reveals or accomplishes"
    subtext: "What's NOT being said directly"
    information_discipline: "What characters do NOT say despite knowing it"

# =============================================================================
# INFORMATION DISCIPLINE CHECKLIST
# Verify against story_bible.yaml before writing
# =============================================================================

pre_writing_checklist:
  - "Confirmed nothing from 'withheld' list is revealed"
  - "Checked disclosure_schedule for what's allowed this chapter"
  - "Verified character knowledge states are accurate"
  - "Ensured breadcrumbs are subtle, not highlighted"
  - "Chapter ending creates pull forward, doesn't resolve too much"

# =============================================================================
# POST-WRITING AUDIT NOTES
# For critics to fill in after draft
# =============================================================================

audit_results:
  tension_score: "X/10 (from tension auditor)"
  information_leakage: "Any premature revelations flagged"
  reader_simulation: "What reader actually learns/suspects from draft"
  needed_revisions: []
